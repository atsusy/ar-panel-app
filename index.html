<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>制御盤ARシミュレーション</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<main id="setup">
  <h1>制御盤ARシミュレーション</h1>

  <form id="size-form" autocomplete="off">
    <fieldset>
      <legend>盤のサイズ (mm)</legend>
      <label>幅 W <input type="number" id="w" inputmode="numeric" min="100" max="5000" step="10" value="800"></label>
      <label>高さ H <input type="number" id="h" inputmode="numeric" min="100" max="3000" step="10" value="1900"></label>
      <label>奥行 D <input type="number" id="d" inputmode="numeric" min="50" max="2000" step="10" value="400"></label>
    </fieldset>
    <div class="color">
      <span class="label">塗装色</span>
      <div class="swatches" id="swatches">
        <button type="button" data-color="#c8c6b8" class="on" title="5Y7/1"><i style="background:#c8c6b8"></i>5Y7/1</button>
        <button type="button" data-color="#e6e4dc"><i style="background:#e6e4dc"></i>アイボリー</button>
        <button type="button" data-color="#a9acae"><i style="background:#a9acae"></i>N7</button>
        <button type="button" data-color="#f2f2f0"><i style="background:#f2f2f0"></i>ホワイト</button>
        <label class="custom" title="任意の色"><input type="color" id="color" value="#c8c6b8">その他</label>
      </div>
    </div>
  </form>

  <div id="preview-wrap"><canvas id="preview"></canvas><div id="dims"></div><button id="door-btn" type="button">扉を開く</button></div>

  <button id="ar-btn" class="primary" disabled>確認中…</button>
  <p id="hint" class="hint"></p>
</main>

<!-- Android WebXR 中に表示するオーバーレイ -->
<div id="xr-overlay" hidden>
  <div class="xr-top">
    <button id="xr-exit" class="round" aria-label="閉じる">✕</button>
    <span id="xr-rec-time" hidden>00:00</span>
  </div>
  <div class="xr-bottom">
    <div id="xr-modes">
      <button data-mode="photo" class="on">写真</button>
      <button data-mode="video">ビデオ</button>
    </div>
    <div class="shutter-row">
      <span id="xr-thumb" class="thumb"></span>
      <button id="xr-shutter" class="shutter photo" aria-label="シャッター"><span></span></button>
      <span class="thumb"></span>
    </div>
  </div>
  <div id="xr-flash"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
